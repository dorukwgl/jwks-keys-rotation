services:
  jwks:
    build: .
    image: jwks:latest
    container_name: jwks-server
    restart: unless-stopped

    ports:
      # Exposed on 0.0.0.0 — accessible on LAN from any machine
      # Micronaut services set:
      #   micronaut.security.token.jwt.signatures.jwks.url=http://<this-host>:41518/.well-known/jwks.json
      - "41518:41518"

    environment:
        # Token expiry in minutes (optional, default 13)
        TOKEN_EXPIRY_MINUTES: "${TOKEN_EXPIRY_MINUTES:-15}"
        # JWKS key rotation interval in minutes (optional, default 120)
        JWK_ROTATION_INTERVAL_MINUTES: "${JWK_ROTATION_INTERVAL_MINUTES:-960}"
        MICRONAUT_ENVIRONMENTS: "prod"

    volumes:
      # Persist JWK keystore across restarts — keys survive container rebuild
      - jwks-data:/var/lib/jwks

    healthcheck:
      # Assumes busybox wget in the nonroot image
      test: wget -qO- http://localhost:41518/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  jwks-data:
